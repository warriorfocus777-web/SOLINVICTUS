function delta(l){
  const moved = [];
  const inC = v => { const d = pd(v); return d !== null && d >= CYC0 && d < CYC1; };
  LANES.forEach(L => { if(L.prev && L.prev !== L.g.st) moved.push(`<b>${t("lane."+L.k,l)}</b> ${t("d.from",l)} ${t("st."+L.prev,l)} ${t("d.to",l)} ${t("st."+L.g.st,l)}`); });
  IND.forEach(x => { const live = x.r.filter(r => !r.x), c = live[live.length-1], b = live[live.length-2];
    const when = c && (c.logged || c.d);
    if(c && inC(when) && (!b || b.v !== c.v)) moved.push(`<b>${x.id}</b> ${b ? `${t("d.from",l)} ${b.v} ` : ""}${t("d.to",l)} ${c.v} <span class="dd">${when}</span>`); });
  return `<div class="delta"><span class="k">${t("delta.k",l)} · ${BOARD.revised}</span>${moved.length ? `<ul>${moved.map(m => `<li>${m}</li>`).join("")}</ul>` : `<p>${t("delta.none",l)}</p>`}</div>`;
}

V.cadre = l => `

    <p class="quiet" style="max-width:64ch">Haiti's security failure is read almost everywhere as a capacity failure: too few police, too little money, too slow a deployment. Capacity is real and it is not the frame. The prior failure is allocation. Functions are unassigned, doubled, or held by whichever body arrived last. A force can be fully funded, fully staffed, and pointed at nothing. A judge can be willing and receive no file. Money moves faster than doctrine, so the funded thing becomes the doctrine by default.</p>

      <div class="pair"><dt>Readings</dt><dd>An indicator is a reading only with all three: a source of record, a value, and the date of that value. Two of three is not a reading. A reading older than the previous cycle is flagged stale, never carried forward silently. Corroboration is counted by originator.</dd></div>
      <div class="pair"><dt>Consultation</dt><dd>Anything online carries a consultation date — a dead link with one is evidence; a dead link without one is nothing.</dd></div>
      <div class="pair"><dt>Dates</dt><dd>Prose: 7 February 2026. Locators and data: 07.02.2026. A date known only to the month or the year says so, and is never padded into a day it does not have. A board covers a cycle, written <em>cycle 09.2026</em>.</dd></div>
      <div class="pair"><dt>Terms</dt><dd>One name per body, defined once, in the <a class="tlink" href="#/${l}/objet/glossaire">glossary</a>.</dd></div>
    </dl>

    <div class="marks rvi"><span class="key">${t("mk.h",l)}</span><dl>
      <div><dt><i class="tk" aria-hidden="true"></i></dt><dd>A lane whose status is deteriorated, or a signed judgement. The only red on the desk.</dd></div>
      <div><dt><span class="conf c-moderate" aria-hidden="true"><i></i><i></i><i></i></span></dt><dd>Confidence: one bar low, two moderate, three high.</dd></div>
      <div><dt>${sq(true)}${sq(false)}</dt><dd>Read or sourced · not read or unsourced. An empty square is a finding, not a gap.</dd></div>
      <div><dt><i class="sq x" aria-hidden="true"></i></dt><dd>A judgement struck at its check date. It stays in the ledger.</dd></div>
    </dl></div>

    <h2 class="mg rvi"><span>II</span>${t("mg.j",l)}</h2>
    <dl class="pairs">
      <div class="pair"><dt>Question</dt><dd>A note answers one closed question, stated before the work begins. A note without a closed question does not build — it accumulates. The question is what the refusal list is measured against.</dd></div>
      <div class="pair"><dt>Type</dt><dd>Every signed sentence is one of three kinds, and says which.</dd></div>
    </dl>
    <div class="tw fit rvi"><table>
      <thead><tr><th>Type</th><th>What it is</th><th>What would show it wrong</th></tr></thead>
      <tbody>
        <tr><th>${t("jt.finding",l)}</th><td>Established from the record.</td><td>A document the record did not contain.</td></tr>
        <tr><th>${t("jt.assessment",l)}</th><td>An inference from the record, with its mechanism stated.</td><td>The mechanism failing in a named case.</td></tr>
        <tr><th>${t("jt.forecast",l)}</th><td>Forward-facing, with a check date.</td><td>The event at the check date.</td></tr>
      </tbody>
    </table></div>
    <dl class="pairs">
      <div class="pair"><dt>Confidence</dt><dd>Low, moderate, high. Three values, never a fourth, declared before the judgement and never as a colour. Confidence is how sure the desk is of its evidence and reasoning. It is not a likelihood: a forecast that states one uses words from one fixed scale, never a percentage.</dd></div>
      <div class="pair"><dt>Model</dt><dd>A judgement that faces forward requires a stated causal link: A produces B under condition C. If the link cannot be drawn as three nodes on paper, the judgement is not high confidence, whatever it feels like.</dd></div>
      <div class="pair"><dt>Bias</dt><dd>Three kinds are assumed present, not confessed once. Cognitive: the last war, the recent event. Emotional: outrage offered as argument. Normative: the state one wishes existed described as the state that does. The mitigation is structural — the refusal list and the gate — not introspection.</dd></div>
    </dl>
    <div class="box teal rvi" style="margin-top:2rem">
      <span class="key">The jugement gate</span>
      <p class="small quiet" style="margin:0 0 .8rem">The single sentence a note is signed on passes nine mechanical tests — length, evaluative adjectives, outrage register, time unit, named actor or named document, hedge density, certainty against declared confidence, figures kept in the body rather than the signature, and conflict with the note's own refusal.</p>
      <p class="small quiet" style="margin:0">Then five questions no machine answers: name the document that would show it false; could a daily brief have written it from today's wire; does it state a mechanism rather than an outrage; is the claim within the declared confidence; and would the desk say it in a room containing the people it describes.</p>
    </div>

    <h2 class="mg rvi"><span>III</span>${t("mg.c",l)}</h2>
    <dl class="pairs">
      <div class="pair"><dt>Refusal</dt><dd>What the note cannot establish is rendered as a section of the note, not a footnote. A note whose refusal field is empty does not build.</dd></div>
      <div class="pair"><dt>The object</dt><dd>Every note leaves something usable by a reader who never reads the note: a table, a template, a map, a timeline. A note without one does not build.</dd></div>
      <div class="pair"><dt>Correction</dt><dd>Superseded text is struck through in place, never deleted. If a judgement changes, that is stated at the top of the note. A judgement that does <em>not</em> change when a relevant document arrives is logged too, with the date and the reason.</dd></div>
      <div class="pair"><dt>Ledger</dt><dd>Every signed sentence sits in the <a class="tlink" href="#/${l}/archive">judgement ledger</a> with its check date. At the check it is scored standing, revised or struck, with the reason. Nothing leaves the ledger.</dd></div>
      <div class="pair"><dt>Cadence</dt><dd>The unit of time is the week for notes and the month for the board. A note that needs this morning's wire belongs to a daily brief. This desk does not publish one.</dd></div>
      <div class="pair"><dt>Signature</dt><dd>Every note carries one designation — <strong>M7</strong> — in the locator strip. It signs the judgement and it owns the corrections. The desk publishes designations, not biographies.</dd></div>
    </dl>

    <p class="firewall">${t("firewall.line",l)}</p>
    <p class="quiet small" style="margin-top:1.75rem">An open-source analysis desk of Haitian origin, operating from Geneva. Its limits are structural and are declared rather than disguised.</p>
  </div>
</section>`;

V.note002 = l => `
<section class="note">
  <p class="locator">N° 002 · 16.09.2026 · ${t("note002.theatre",l)} · [${jtype(JUD["J-002"],l)} · ${t("conf.mod",l)}] · M7</p>
  <h1>La chaîne de garde</h1>
  <p class="stand">${NOTE["chaine-de-garde"].stand}</p>

  <p class="q"><span class="k">${t("note.q",l)}</span>At what point is a GSF-involved arrest counted as having reached a Haitian judge, and which holder is measured?</p>

  <div class="jug">
    <span class="key">${t("jug.key",l)}</span>
    <p>${glo(t("jug.002",l),l)}</p>
    <span class="sig">${jsig("J-002",l)}</span>
    ${jLinks("J-002",l)}
  </div>
  ${kfBox("chaine-de-garde",l)}
  ${sinceBox("chaine-de-garde",l)}

  <h2>What the mandate authorises</h2>
  <p>Paragraph 5 of Resolution 2793 decides that the Gang Suppression Force may adopt urgent temporary measures, "limited in scope, time bound, proportionate," to assist the Haitian National Police in maintaining basic law and order, <strong>including through arrest and detention</strong>, in full compliance with international law. The same paragraph asks the force to "cooperate closely with the Haitian judiciary, <em>as appropriate</em>, in order to ensure that apprehended gang members are dealt with in a manner that upholds the rule of law."${cn("chaine-de-garde","S6")}</p>
  <p>Two qualifiers carry the weight. <em>As appropriate</em> leaves the judiciary's involvement to the force's own assessment. And the paragraph's reporting instruction runs outward: it requests the leadership of the GSF "to subsequently notify the HNP and update the Security Council on any measures that may be adopted on this basis."${cn("chaine-de-garde","S6")}</p>
  <p>Notification to a police force is not a record. An update to the Security Council is not a docket. Neither produces a number a Haitian court, a Haitian prosecutor, or a Haitian citizen can check.</p>

  <h2>Where Haitian law puts the counting point</h2>
  <p>Article 26 of the 1987 Constitution is exact: "No one may be kept under arrest more than forty-eight (48) hours unless he has appeared before a judge asked to rule on the legality of the arrest and the judge has confirmed the arrest by a well-founded decision."${cn("chaine-de-garde","S14")}</p>
  <p>That is the counting point, and it already exists. It is not a benchmark anyone has to invent. It is a constitutional act with a clock attached, and it produces a document: a reasoned decision confirming or refusing the arrest.</p>
  <p>The instrument is not missing from Haitian law. It is missing from the mandate that measures the force.</p>

  <h2>What is counted now</h2>
  <p>The Gang Suppression Force's own public reporting carries casualties, displaced persons, health-facility functionality and authorised personnel. It publishes no arrest figures and no custody figures.${cn("chaine-de-garde","S15")}</p>
  <p>The BINUH quarterly report for January–March 2026 contains no category for GSF arrests and no tracking of what happened to anyone arrested.${cn("chaine-de-garde","S12")}</p>
  <p>The report for April–June 2026 contains one paragraph. On 21 June, during an operation in the Tabarre 43 area, the force "apprehended 14 individuals suspected of association with gangs. Thirteen of them were subsequently released by the judicial authorities due to insufficient evidence linking them to criminal activities. One individual, however, remained in detention pending further judicial proceedings."${cn("chaine-de-garde","S13")}</p>
  <p>That paragraph is the entire public record of what becomes of a person the force detains. It is an incident note filed by an observer. It is not produced by any holder. It appears in one quarter and not in the one before it. <strong>This desk holds it from one source.</strong></p>
  <p>Read against the same report's prison figures — 7,563 people detained as of 30 June 2026, 82 per cent of them in pretrial detention${cn("chaine-de-garde","S13","S12")} — the disposition is worth stating precisely: thirteen of fourteen were released by judicial authorities for insufficient evidence. On the only occasion the public record describes, the judiciary functioned as a filter. Whether that is representative cannot be established from one paragraph, and this desk does not assert it.</p>

  <h2>The one named handover instrument covers children</h2>
  <p>The preamble to Resolution 2793 affirms "the importance of the 2024 Handover Protocol between the United Nations and the Government of Haiti as an important step toward protecting children detained for alleged association with armed groups."${cn("chaine-de-garde","S6")}</p>
  <p>A transfer instrument therefore exists, was negotiated, and is named in the mandate. It covers minors. No equivalent instrument for adults is named in the resolution, <s class="strk">and this desk has located none.</s> <span class="rv-in">[28.10.2026: S/2026/800 ¶10 reports a transfer agreement signed on 14 July 2026 for “individuals apprehended during operations”. Its text is not public.${cn("chaine-de-garde","S29")}]</span></p>
  <p>The asymmetry is the finding. Where the international system decided a handover needed a protocol, it wrote one. For everyone else, paragraph 5 says <em>as appropriate</em>. <span class="rv-in">[28.10.2026: narrower than stated — an agreement exists. What remains is that it is not public and counts no one.]</span></p>

  <h2>Why this bears on the third objective</h2>
  <p>The strategy required under paragraph 15 was filed on 29 June 2026 by the Special Representative for the Gang Suppression Force. It sets three objectives — removal of gang control over territory, securing critical infrastructure, and Haitian authorities having the ability to contain gang violence — against a target date of 30 September 2028.${cn("chaine-de-garde","S16")}</p>
  <p>The third is the exit condition. Containment that cannot be prosecuted is containment that has to be performed again. The holder that prosecutes is the PNH, whose test of health in this cadre is files reaching a judge with usable evidence, monthly. Nobody counts them.</p>
  <p>So the third objective is stated as a capacity and measured by nothing that touches the capacity. A force can meet objectives one and two, be judged successful on the metrics it filed, and hand over to a judicial chain whose throughput was never on the board.</p>

  <h2>Delegated coercion is the old part</h2>
  <p>Coercive authority exercised by a body that is not the state's own police, with the state's tolerance, is the oldest continuity in this file. <em>Shadows of Governance</em> (IHEID, 2025) traces it across the Volontaires de la Sécurité Nationale from 1959, the attachés of the late 1980s, and the chimères of 1994–2004 — three formations, one structure, in which the state kept the legitimacy and delegated the violence.${cn("chaine-de-garde","S11")}</p>
  <p>The novelty in 2026 is not that coercion is delegated. It is the direction of the report. The Volontaires answered to the Palace. The Gang Suppression Force notifies the Haitian National Police and updates the Security Council. Delegated coercion that reports outward is a different object from delegated coercion that reports inward, and the difference is exactly the gap this note is about: the file does not come back.</p>

  <div class="box ink">
    <span class="key">${t("note.refusal",l)}</span>
    <ul>
      <li><strong>That no instrument exists.</strong> The 29 June letter filed under paragraph 15 has not been read by this desk in full. Its three objectives and its target date are held from a secondary summary. If that letter contains a judicial-disposition metric, the judgement above is wrong, and this desk will strike it in place and say so.</li>
      <li><strong>That the Tabarre 43 figures are corroborated.</strong> They are held from one source. One source is a report, not a fact.</li>
      <li><strong>That the force keeps no internal record.</strong> The desk can establish that no record is published. It cannot see inside the force.</li>
      <li><strong>That any arrest was unlawful.</strong> That is a finding for a Haitian judge, and this desk does not have one.</li>
      <li><strong>Anything about any individual</strong> apprehended on 21 June or on any other date — guilt, affiliation, identity or treatment.</li>
      <li><strong>That the 2024 Handover Protocol is adequate or inadequate.</strong> Its terms have not been read. The desk establishes only that it is named and that it covers children.</li>
      <li><strong>That 82 per cent pretrial detention is a GSF outcome.</strong> It is a prison-system figure that predates the force. It is context, not evidence.</li>
    </ul>
  </div>

  <div class="box teal">
    <span class="key" id="fals-002">${t("note.falsifier",l)}</span>
    <ul>
      <li>The 29 June paragraph 15 letter, read in full, containing a metric that counts arrest dispositions.</li>
      <li>A BINUH quarterly that adds a standing GSF arrest-disposition category rather than an incident paragraph.</li>
      <li>A published handover register, from the force or from the PNH, counting persons transferred and the date each appeared before a judge.</li>
    </ul>

V.note = l => `
<article class="note">
  <p class="locator">N° 001 · 04.09.2026 · rev. 20.10.2026 · National · [${jtype(JUD["J-004"],l)} · ${jconf(JUD["J-004"],l)}] · M7</p>
  <h1>The Third Objective</h1>
  <p class="stand">${NOTE["le-troisieme-objectif"].stand}</p>

  <p class="q"><span class="k">${t("note.q",l)}</span>Does the end-state filed for the Gang Suppression Force name what it hands over, and to whom?</p>

  <p class="revnote rvi"><span class="k">${t("rev.k",l)} · 20.10.2026</span>The judgement below replaces the one struck beneath it. The paragraph 24 benchmarks had been published on 15 January 2026, as Annex II of S/2026/31${cn("le-troisieme-objectif","S21")}; this note did not hold them when it was signed. The body is left as published, with dated corrections in place.</p>

  <div class="jug">
    <span class="key">${t("jug.key",l)} · ${t("rev.k",l).toLowerCase()} 20.10.2026</span>
    <p>${glo(t("jug.001r",l),l)}</p>
    <span class="sig">${jsig("J-004",l)}</span>
    ${jLinks("J-004",l)}
    <div class="was rvi"><span class="k">${t("js.revised",l)} · J-001</span>
      <p><s class="strk">${t("jug.001",l)}</s></p>
      <span class="sig">${jsig("J-001",l)}</span></div>
  </div>
  ${kfBox("le-troisieme-objectif",l)}
  ${sinceBox("le-troisieme-objectif",l)}

  <h2>What Resolution 2793 filed</h2>
  <p>On 29 June 2026, the Special Representative for the Gang Suppression Force, Jack Christofides, transmitted to the Security Council the strategy required under paragraph 15 of Resolution 2793: concrete, timebound objectives with benchmarks toward an end-state.${cn("le-troisieme-objectif","S7","S6")} There are three objectives. Removal of gang control over territory. Securing critical infrastructure. <strong>Haitian authorities having the ability to contain gang violence.</strong> The target date is 30 September 2028.${cn("le-troisieme-objectif","S7")}</p>
  <p>The first two are military tasks with observable outcomes. The third is the exit condition, and it is the only one that decides whether the other two amount to anything. It contains three unstated terms: which authority, measured how, and whether that capacity has ever existed.</p>
  <p>Resolution 2793 also asked, at paragraph 24, for benchmarks to be met by the Haitian authorities, with the goal of preparing the transition of tasks and responsibilities to the Government of Haiti, within three months of adoption. The Secretary-General's report of 14 July 2026 does not set them out.${cn("le-troisieme-objectif","S6","S1")} <span class="rv-in">[20.10.2026: they had been set out in Annex II of S/2026/31, 15 January 2026.${cn("le-troisieme-objectif","S21")}]</span></p>

  <h2>February 2026</h2>
  <p>The Transitional Presidential Council's mandate ended on 7 February 2026. No successor council was seated. Executive authority passed to Alix Didier Fils-Aimé — an unelected prime minister, governing without a president and without a parliament, and, as <em>Le Nouvelliste</em> reported the same week, with the declared support of the international community.${cn("le-troisieme-objectif","S4","S5")}</p>
  <p>A first electoral round is set for 13 December 2026, a possible second for 21 February 2027, with an elected president to take office by 7 February 2027.${cn("le-troisieme-objectif","S1","S3")} Until then, no office in Haiti holds a mandate from any Haitian electorate. The recipient named in the third objective is, at the date of this note, a government that has not been elected and a body that has not been named.</p>

  <h2>The arithmetic of the force</h2>
  <p>Resolution 2793 authorises a ceiling of 5,550: 5,500 uniformed personnel and 50 civilians.${cn("le-troisieme-objectif","S6")} On 8 July 2026 — month nine of twelve — the force stood at 1,083 military personnel drawn from Chad, Jamaica, Sri Lanka, Mongolia, El Salvador and Guatemala, and 16 civilians.${cn("le-troisieme-objectif","S1")} Full operational capacity is expected between October and the end of the year.${cn("le-troisieme-objectif","S3")} Of $223.5 million pledged by fifteen member states, $184.2 million had been received in cash and $67.5 million disbursed.${cn("le-troisieme-objectif","S1","S3")}</p>
  <p>Operational command sits with a Force Commander selected by the Standing Group of Partners, exercising day-to-day operational decision-making.${cn("le-troisieme-objectif","S6")} Operations are conducted together and in cooperation with the Haitian National Police and the Haitian armed forces. Cooperation and command are different things, and the distinction is the point: this is an external armed actor holding operational authority over Haitian territory, coordinating with Haitian institutions that do not direct it.</p>
  <p>Set the dates beside each other. The force reaches full strength around the turn of the year. An elected government is due by 7 February 2027. The transfer of the ability to contain gang violence to "Haitian authorities" is timed for 30 September 2028.</p>

  <h2>Three tests</h2>
  <p>An end-state phrased as a capacity cannot fail. "The ability to contain gang violence" has no threshold, no holder and no instrument of measurement, which means the 2028 date can be moved indefinitely without anything being conceded. Three substitutions would make it checkable, and they are the object this note leaves behind.</p>
  <dl class="pairs">
    <div class="pair"><dt>Name it</dt><dd>Not "Haitian authorities" but the Haitian National Police, the Haitian armed forces, or a named joint command, with the function assigned to each. An unnamed recipient cannot be found to have failed to receive.</dd></div>
    <div class="pair"><dt>Measure it</dt><dd>Files reaching a judge with usable evidence, monthly. Integrity of the custody chain for arrests effected with GSF involvement — a foreign force that detains without delivering into a functioning Haitian judicial process manufactures impunity on both sides of the transaction. Days to reopen a severed national route. These are countable, and they can fall.</dd></div>
    <div class="pair"><dt>Date it</dt><dd>7 February 2027 is a date that exists in Haitian law. 30 September 2028 is a date that exists in a strategy document.</dd></div>
  </dl>

  <div class="box teal" id="exp-001">
    <span class="key">An expectation, on the record</span>
    <p class="small" style="margin:0 0 .8rem">The desk states one, so that this note can be found to have been wrong.</p>
    <p class="small rvi" style="margin:0 0 .8rem"><s class="strk">If the mandate is renewed without the paragraph 24 benchmarks being published and without a named recipient institution, then at the next renewal in September 2027 the same three objectives will be restated, the end-state date will have moved beyond 30 September 2028, and the third objective will still be phrased as a capacity rather than an institution.</s></p>
    <p class="small rv-in" style="margin:0 0 .8rem">Struck 20.10.2026: the condition was false before the renewal — the benchmarks had been published on 15 January 2026. The expectation could not be tested as signed. It stays in the ledger.</p>
    <p class="ver" style="margin:0">${jsig("J-003",l)} · ${t("js.struck",l)}</p>
  </div>

  <h2>Four constants</h2>
  <p>The historical object. As argued in <em>Shadows of Governance</em> (IHEID, 2025), Haitian political authority between 1950 and 1990 was exercised through armed formations that international analysis has filed as symptoms of collapse — the Tonton Macoutes, the zenglendos, the attachés, the chimères. Four structural features recur across regimes with different ideologies, different patrons and different enemies.${cn("le-troisieme-objectif","S11")}</p>
  <div class="tw"><table>
    <thead><tr><th>Constant</th><th>1957–1986</th><th>2026</th></tr></thead>
    <tbody>${CONSTANTS.map(c=>`<tr><th>${c[0]}</th><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</tbody>
  </table></div>
  <p><span class="li">Delegated coercion.</span> Violence is distributed to territorial intermediaries rather than concentrated at a centre. The Volontaires de la Sécurité Nationale, founded in 1959, were not a national army but a lateral network in which each neighbourhood acquired its own enforcer and each outpost served at once as shrine and tribunal.</p>
  <p><span class="li">Ritual legitimation.</span> Authority is authorised by something exceeding the law. François Duvalier's dark suits and glasses aligned the presidency with Baron Samedi; a CIA reference document of October 1983 treats his use of Vodou-mysticism as an instrument of political control rather than as folklore.${cn("le-troisieme-objectif","S10")} After 1971 the regime governed through a division of sovereign labour between the living ruler and the sanctified dead.</p>
  <p><span class="li">Extraverted dependency.</span> Internal dominance is financed by external alliance. Bayart's term, and in Haiti it is close to the whole of foreign policy. Duvalier sold anti-communism in Washington. Aristide, restored in 1994, sold reconstruction to donors. Jimmy Chérizier gives interviews. The February transition places the same mechanism on the state's side of the ledger.</p>
  <p>Each rupture the international system recorded was, structurally, a mutation. 1986 dispersed the architecture into attachés and zenglendos rather than dismantling it. Aristide re-enchanted it through liberation theology and the chimères rather than secularising it. Structural adjustment delegated taxation and internal security outward while leaving the formal shell standing, after which international programmes contracted with whoever held the ground.</p>

  <h2>Why the constants bear on the third objective</h2>
  <p>The third objective transfers a capacity. The four constants describe why no Haitian institution has held it: authority exercised through territorial intermediaries rather than a centre, authorised by claims exceeding law, financed by external alliance, coordinated by negotiated alignment rather than hierarchy. Those four survived Duvalier, the 1986 dispersal, Aristide, structural adjustment and MINUSTAH. An end-state naming "Haitian authorities" as recipient is therefore not naming a body that lost the capacity and could recover it. It is naming a body that would have to be constituted. That is a different project, on a different timescale, and Resolution 2793 does not say which one it is funding.</p>

  <div class="box">
    <span class="key">What this refuses</span>
    <p class="small">Gang governance as a <em>modality</em> of sovereignty is an analytic claim, and it collapses the moment it is used as a moral verdict.</p>
    <p class="small">Human Rights Watch records at least 4,384 people killed between January and September 2025 and thirteen massacres by year's end.${cn("le-troisieme-objectif","S2")} The Secretary-General's report of 14 July 2026 records 1.47 million internally displaced as of 13 May — twelve percent of the population, 54 percent of them women and girls; at least 542 killed and 355 injured in La Plaine du Cul-de-Sac, with 176 women and girls raped; 825 incidents of sexual violence between 1 March and 31 May, involving 853 victims.${cn("le-troisieme-objectif","S1")} Viv Ansanm is listed by the Security Council and designated by the United States on grounds including coordinated attacks on prisons, hospitals and infrastructure, and the use of minors.${cn("le-troisieme-objectif","S8","S9")}</p>
    <p class="small">Recognising plural sovereignty requires criteria for separating formations that empower communities from those that reproduce domination: embeddedness in local practice, responsiveness to social need, resistance to external exploitation. Applied here, those figures are the finding. Description is not defence, and the misreading is available enough that this belongs in the body rather than at the foot.</p>
    <ul>
      <li>No access to Haitian government deliberations, and no knowledge of the renewal terms under negotiation between the United States and Panama, expected penholders.</li>
      <li>Deployment and funding figures are those of 8 July 2026 and will have moved. They are given with that date attached and should not be repeated without it.</li>
      <li>Human Rights Watch gives roughly 90 percent of the Port-au-Prince metropolitan area under criminal-group control; the Secretary-General's report of 14 July names communes without giving a percentage.${cn("le-troisieme-objectif","S2","S1")} The table above follows the UN formulation because it is the one that can be checked against a document.</li>
      <li class="rvi"><s class="strk">The paragraph 24 benchmarks may exist in a document this desk has not seen. The claim made here is that the report of 14 July does not set them out.</s> <span class="rv-in">20.10.2026: they exist — S/2026/31, Annex II. See the revision above.</span></li>
      <li>No forecast on whether the 13 December elections are held.</li>
      <li>No claim of individual criminal responsibility beyond what the Council and the US designations state.</li>
    </ul>
  </div>

  <p class="quiet small"><em>A note on the ceiling.</em> Reputable sources give the GSF ceiling as both 5,500 and 5,550. Both are correct: paragraph 4 authorises 5,550, comprising 5,500 uniformed personnel and 50 civilians.${cn("le-troisieme-objectif","S6")} The discrepancy is a summarisation artefact, and it is recorded here because a desk that quietly picks one number teaches its readers nothing.</p>

  <div class="box ink">
    <span class="key">The object</span>
    <h3 style="margin:0 0 .5rem;font-size:1.125rem">Four constants of Haitian sovereignty, 1957–2026, and three tests for an end-state</h3>
    <p class="small quiet" style="margin:0 0 .9rem">A grid for placing any Haitian armed formation against the four structural continuities, and three substitutions that convert an end-state stated as a capacity into one that can fail.</p>
    <a class="tlink" href="#/${l}/objet/quatre-constantes">Open the object</a>
    <span class="ver" style="display:block;margin-top:.6rem">One page · A4 · fillable · prints from the object page</span>

  <div style="border-top:1px solid var(--rule-teal);padding-top:1.5rem;margin-top:2.5rem">

    <p class="ver" style="margin-top:1.25rem">First published 04.09.2026. Revision 16.10.2026: the closed question, answered by the note since publication, is now stated above the judgement; the source line cites <em>Shadows of Governance</em> as a titled work. Revision 19.10.2026: key findings added; sources numbered and cited inline; the 29 June letter recorded as not held in full, consistent with Note 002; Resolution 2829 logged above. Judgement and body unchanged. Revision 20.10.2026: judgement revised on the paragraph 24 benchmark framework (J-001 struck in place, J-004 signed); the expectation (J-003) struck; dated corrections added in the body. · M7</p>

</article>`;

/* ============================================================ router */
const LANGS = ["fr","en","ht"];
const KNOWN = ["situation","cadre","methode","archive","mentions"];
const TITLES = {home:"Cadre 22", situation:"Situation — Cadre 22", cadre:"Cadre v0.1 — Cadre 22",
                methode:"Méthode — Cadre 22", archive:"Archive — Cadre 22",
                service:"Service — Cadre 22", mentions:"Mentions — Cadre 22",
                objet:"Objet 001 — Cadre 22", registre:"Registre — Cadre 22",
                note002:"La chaîne de garde — Cadre 22", comptage:"Le point de comptage — Cadre 22",
                note:"Le troisième objectif — Cadre 22", glossaire:"Glossaire — Cadre 22", four:"404 — Cadre 22"};

function parse(){
  const seg = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const lang = LANGS.includes(seg[0]) ? seg.shift() : "fr";
  if(!seg.length) return {lang, route:"home"};
  if(seg[0]==="archive" && seg[1]){
    const NOTES = {"le-troisieme-objectif":"note", "chaine-de-garde":"note002"};
    return {lang, route: NOTES[seg[1]] || "four"};
  }
  if(seg[0]==="objet"){
    const OBJ = {"quatre-constantes":"objet", "registre":"registre", "point-de-comptage":"comptage", "glossaire":"glossaire"};
    return {lang, route: OBJ[seg[1]] || "four"};
  }
  if(KNOWN.includes(seg[0])) return {lang, route:seg[0]};
  return {lang, route:"four"};
}

function pathOf(route){
  if(route==="note") return "archive/le-troisieme-objectif";
  if(route==="objet") return "objet/quatre-constantes";
  if(route==="registre") return "objet/registre";
  if(route==="note002") return "archive/chaine-de-garde";
  if(route==="comptage") return "objet/point-de-comptage";
  if(route==="glossaire") return "objet/glossaire";
  if(route==="home"||route==="four") return "";
  return route;
}

function render(){
  const {lang, route} = parse();
  document.querySelector(".site").setAttribute("data-lang", lang);
  document.documentElement.setAttribute("lang", lang);
  document.body.dataset.route = route;
  document.title = TITLES[route] || "Cadre 22";

  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t, lang));
  document.querySelectorAll(".nav a").forEach(a => {
    a.href = `#/${lang}/${a.dataset.r}`;
    const on = a.dataset.r === route
      || (route==="note" && a.dataset.r==="archive")
      || (route==="objet" && a.dataset.r==="archive")
      || (route==="note002" && a.dataset.r==="archive")
      || (route==="registre" && a.dataset.r==="archive")
      || (route==="comptage" && a.dataset.r==="archive")
      || (route==="glossaire" && a.dataset.r==="archive");
    a.classList.toggle("on", on);
    if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.querySelector(".wordmark").href = `#/${lang}/`;
  const stamp = document.getElementById("stamp");
  stamp.hidden = route === "four";
  stamp.innerHTML = `${t("stamp.board",lang)} ${BOARD.revised} · Note 001 ${t("stamp.rev",lang)} ${NOTE["le-troisieme-objectif"].rev} · ${t("stamp.obj",lang)} ${BOARD.objects}`;
  document.getElementById("lnk-contact").href = `#/${lang}/mentions`;
  document.getElementById("lnk-legal").href   = `#/${lang}/mentions`;
  document.querySelectorAll(".toggle button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.l === lang)));

  const view = V[route] || V.four;
  const err = DATA_ERROR
    ? `<p class="banner" style="border-color:var(--aries)">desk-data is not valid JSON — the board and archive stay empty until it is fixed. <span class="ver">${DATA_ERROR}</span></p>`
    : "";
  const banner = (lang !== "en" && route !== "four" && route !== "mentions" && route !== "objet" && route !== "glossaire")
    ? `<p class="banner">${t("banner.prose", lang)}</p>` : "";
  const main = document.getElementById("main");
  main.innerHTML = err + banner + view(lang);
  // Ink plays when the route changes. A language toggle re-renders the same
  // route; it does not get a second rise.
  const sameRoute = LAST_ROUTE === route;
  LAST_ROUTE = route;
  main.classList.remove("ink");
  if(!sameRoute && !STILL.matches){ void main.offsetWidth; main.classList.add("ink"); }
  revealOnScroll(main);
  document.querySelectorAll("canvas.pxm").forEach(pxmInit);
  main.querySelectorAll(".tw").forEach(w => { if(w.scrollWidth > w.clientWidth + 1) w.tabIndex = 0; });

  const wr = document.getElementById("write");
  if(wr) wr.addEventListener("submit", ev => {
    ev.preventDefault();
    if(!DESK_EMAIL_LIVE) return;
    const g = n => (wr.elements[n] && wr.elements[n].value || "").trim();
    const body = [g("claim"), "", "Document or count that would change the desk's mind:", g("doc")].join("\n");
    location.href = `mailto:${DESK_EMAIL}?subject=${encodeURIComponent("Cadre 22")}&body=${encodeURIComponent(body)}`;
  });
  const form = document.getElementById("ask");
  if(form) form.addEventListener("submit", ev => {
    ev.preventDefault();
    const g = n => (form.elements[n] && form.elements[n].value || "").trim();
    const subject = `Cadre 22 — ${g("theatre") || "demande"} — utile jusqu'au ${g("until") || "—"}`;
    const body = [
      "Question:", g("question"), "",
      "Théâtre: " + g("theatre"),
      "Utile jusqu'au: " + g("until"),
      "Langue de remise: " + g("delivery"),
      "Adresse de retour: " + g("email")
    ].join("\n");
    location.href = `mailto:${DESK_EMAIL}`
      + `?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });

  window.scrollTo(0,0);
  reveal();
  if(PENDING){ const el = document.getElementById(PENDING); PENDING = null;
    if(el) requestAnimationFrame(() => el.scrollIntoView({block:"start"})); }
}

document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => {
  const {route} = parse();
  location.hash = `#/${b.dataset.l}/${pathOf(route)}`;
}));
// ── reveal ─────────────────────────────────────────────────────────────
// One observer, rebuilt each render because the view replaces its own
// markup. Every element is revealed once and then released. Without
// IntersectionObserver everything is revealed immediately: the motion is
// the ornament, the rule itself is the content.
let IO = null;
function reveal(){
  const els = document.querySelectorAll("#main .band[data-rule], #main .strip, #main .ledger, #main .age");
  if(!("IntersectionObserver" in window)){
    els.forEach(e => e.classList.add("in"));
    return;
  }
  if(IO) IO.disconnect();
  IO = new IntersectionObserver((entries, obs) => {
    entries.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add("in"); obs.unobserve(e.target); }
    });
  }, {rootMargin: "0px 0px -8% 0px", threshold: 0});
  els.forEach(e => IO.observe(e));
}

// ── sea: the lamp ──────────────────────────────────────────────────────
// A radial teal wash that follows the pointer at a distance. The lerp is
// deliberately slow so the light reads as a fixture in the room rather
// than a spotlight tracking a mouse. One rAF while moving, none at rest.
(function lamp(){
  if(STILL.matches || !matchMedia("(pointer:fine)").matches) return;
  const root = document.documentElement;
  let tx = 50, ty = 8, cx = 50, cy = 8, running = false;
  function frame(){
    cx += (tx - cx) * 0.055;
    cy += (ty - cy) * 0.055;
    root.style.setProperty("--mx", cx.toFixed(2) + "%");
    root.style.setProperty("--my", cy.toFixed(2) + "%");
    if(Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05){ requestAnimationFrame(frame); }
    else { running = false; }
  }
  document.documentElement.addEventListener("pointerleave", () => {
    tx = 50; ty = 8; if(!running){ running = true; requestAnimationFrame(frame); }
  });
  addEventListener("pointermove", ev => {
    tx = (ev.clientX / innerWidth) * 100;
    ty = (ev.clientY / innerHeight) * 100;
    if(!running){ running = true; requestAnimationFrame(frame); }
  }, {passive:true});
})();

// ── the dossier: what this desk holds for a department, never who holds it
function dossier(k, l){
  const d = HAITI.deps.find(x => x.k === k); if(!d) return "";
  const st = d.st, P = (DATA.places || {})[k] || {};
  const cite = str => String(str).replace(/\s?\[(S\d+)\]/g, (m, id) => BOARD_SRC[id] ? ct([id], "b", BOARD_SRC) : "");
  return `<span class="tk2">${t("dz.k",l)} · ${BOARD.revised}</span><b class="dn">${d.n}</b>
    <span class="dl"><i class="sw ${st}"></i>${t(st==="sourced"?"cov.s":st==="claimed"?"cov.c":"cov.b",l)}</span>
    ${d.why.length ? `<span class="dr"><em>${t("dz.lanes",l)}</em>${d.why.map(x => t("lane."+x,l)).join(" · ")}</span>` : ""}
    <span class="dr"><em>${t("dz.gsf",l)}</em>${P.gsf ? cite(P.gsf) : t("dz.none",l)}</span>
    <span class="dr"><em>${t("dz.gap",l)}</em>${P.gap ? cite(P.gap) : t("dz.nogap",l)}</span>`;
}
let TIP = null;
function tipAt(ev, k){
  if(!TIP){ TIP = document.createElement("div"); TIP.className = "maptip"; TIP.setAttribute("role","status"); document.body.appendChild(TIP); }
  TIP.innerHTML = dossier(k, l0()); TIP.hidden = false;
  const r = ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  const x = ev.clientX || (r ? r.left + r.width/2 : 0), y = ev.clientY || (r ? r.top : 0);
  const w = TIP.offsetWidth, h = TIP.offsetHeight;
  TIP.style.left = Math.max(12, Math.min(innerWidth - w - 12, x + 18)) + "px";
  TIP.style.top  = Math.max(12, Math.min(innerHeight - h - 12, y + 18)) + "px";
}
document.addEventListener("pointermove", ev => {
  const p = ev.target.closest && ev.target.closest(".plate path[data-k]");
  if(p) tipAt(ev, p.dataset.k); else if(TIP) TIP.hidden = true;
}, {passive:true});
document.addEventListener("focusin", ev => {
  const p = ev.target.closest && ev.target.closest(".plate path[data-k]");
  if(p) tipAt(ev, p.dataset.k); else if(TIP) TIP.hidden = true;
});
addEventListener("hashchange", () => { if(TIP) TIP.hidden = true; });
addEventListener("scroll", () => { if(TIP && !TIP.hidden) TIP.hidden = true; }, {passive:true});
// ── the coverage plate reads back what is under the pointer ───────────
function covHover(ev){
  const p = ev.target.closest && ev.target.closest(".plate.cov path[data-k]");
  const out = document.querySelector(".cov-read"); if(!out) return;
  document.querySelectorAll(".plate.cov path.hl").forEach(x => x.classList.remove("hl"));
  if(p){ p.classList.add("hl"); out.innerHTML = covRead(p.dataset.k, l0()); }
}
document.addEventListener("pointerover", covHover);
document.addEventListener("focusin", covHover);
document.addEventListener("pointerout", ev => {
  if(ev.target.closest && ev.target.closest(".plate.cov") && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest(".plate.cov"))){
    const out = document.querySelector(".cov-read"); if(out) out.innerHTML = t("cov.hint", l0());
    document.querySelectorAll(".plate.cov path.hl").forEach(x => x.classList.remove("hl"));
  }
});
// ── the cycle stepper: only departments whose coverage moved are re-cut ─
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".cycstep button"); if(!b) return;
  const was = (document.querySelector(".cycstep button[aria-pressed=true]") || {dataset:{}}).dataset.c;
  if(was === b.dataset.c) return;
  document.querySelectorAll(".cycstep button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const plate = document.querySelector(".plate.cov"), l = l0();
  plate.classList.add("done");
  plate.innerHTML = covSvg(b.dataset.c, was, l);
  document.querySelector("p.cov").innerHTML = covLegend(b.dataset.c, l);
});
let PENDING = null;
document.addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest("a[data-scroll]");
  if(a) PENDING = a.dataset.scroll;
  const f = ev.target.closest && ev.target.closest(".fl");
  if(f){ const el = document.getElementById(f.dataset.to);
    if(el){ el.classList.remove("rv"); el.classList.add("in");
      el.scrollIntoView({behavior: STILL.matches ? "auto" : "smooth", block: "center"}); } }
});
// ── a citation answers: the source row is brought to the reader and
// marked for a moment. A button, not a link: the hash belongs to the router.
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".ct");
  if(!b) return;
  let el = document.getElementById(b.dataset.to);
  if(!el && b.dataset.to.startsWith("rl-")){ PENDING = "b-" + b.dataset.to.slice(3); location.hash = `#/${l0()}/situation`; return; }
  if(!el) return;
  el.classList.remove("rv"); el.classList.add("in", "hit");
  el.scrollIntoView({behavior: STILL.matches ? "auto" : "smooth", block: "center"});
  clearTimeout(el._hit); el._hit = setTimeout(() => el.classList.remove("hit"), 1800);
});

addEventListener("hashchange", render);
if(!location.hash) location.hash = "#/en/";
render();

// ── ledger filters: a pressed chip narrows its group; none pressed shows all
document.addEventListener("click", ev => {
  const b = ev.target.closest(".jf button"); if(!b) return;
  b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
  const on = f => [...document.querySelectorAll(`.jf button[data-f=${f}][aria-pressed=true]`)].map(x => x.dataset.v);
  const st = on("st"), ty = on("ty");
  document.querySelectorAll(".jl .jr:not(.jh)").forEach(r => {
    r.hidden = !!((st.length && !st.includes(r.dataset.st)) || (ty.length && !ty.includes(r.dataset.ty))); });
});
